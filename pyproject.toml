[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-forge"
dynamic = ["version"]
description = "EPUB F.O.R.G.E. — Factory for Overhauling and Renovating Glitchy EPUBs: rebuilds any EPUB into standards-clean EPUB 3.3 while preserving its visual identity"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

# Upper bounds, and they are not decoration. A parser's version is part of
# this product's semantics: `lxml` decides how a recovered document comes out,
# `cssutils` decides how a stylesheet is serialised, and `Pillow` decides what
# a transcoded image is. Lower bounds alone mean two builds of the same release
# can produce different files, which makes an incident impossible to reproduce.
#
# This is not a lockfile and does not pretend to be one — see the build manifest
# the release workflow attaches to every build, which records the exact versions
# that produced it. What these bounds buy is that a new *major* cannot land in a
# release without somebody choosing it.
dependencies = [
    "lxml>=5.0,<7",
    "cssutils>=2.9,<3",
    "Pillow>=10.0,<13",
    "rich>=13.0,<16",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6,<7"]
dev = ["pytest>=8.0,<10"]

[project.scripts]
epubforge = "epubforge.cli:main"

[tool.setuptools.dynamic]
version = { attr = "epubforge.__version__" }

[tool.setuptools.packages.find]
include = ["epubforge*"]

# The validator driver is Java source that ships with the package and is
# compiled on first use where there is a JDK — a packaged release compiles it
# at packaging time instead. Without this line setuptools installs only the
# .py files and an installed copy silently starts a JVM per book.
[tool.setuptools.package-data]
epubforge = ["java/*.java"]

[tool.pytest.ini_options]
markers = [
    "renders: needs a browser and draws pages; excluded from the suite-wide skip",
    "validates: asks EPUBCheck for a verdict on purpose; the gate is not stood down",
]
testpaths = ["tests"]
