[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-forge"
dynamic = ["version"]
description = "EPUB F.O.R.G.E. — Factory for Overhauling and Renovating Glitchy EPUBs: rebuilds any EPUB into standards-clean EPUB 3.3 while preserving its visual identity"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

# Upper bounds, and they are not decoration. A parser's version is part of
# this product's semantics: `lxml` decides how a recovered document comes out,
# `cssutils` decides how a stylesheet is serialised, and `Pillow` decides what
# a transcoded image is. Lower bounds alone mean two builds of the same release
# can produce different files, which makes an incident impossible to reproduce.
#
# This is not a lockfile and does not pretend to be one — see the build manifest
# the release workflow attaches to every build, which records the exact versions
# that produced it. What these bounds buy is that a new *major* cannot land in a
# release without somebody choosing it.
dependencies = [
    "lxml>=5.0,<7",
    "cssutils>=2.9,<3",
    "Pillow>=10.0,<13",
    "rich>=13.0,<16",
    # WP-10. Hunspell's algorithm in pure Python, reading the same .dic/.aff
    # files. Not the C binding: `pip install hunspell` does not build even on a
    # Linux box with a full toolchain, so it would never have built on the
    # Windows runner. Optional at runtime — `dictionaries.py` answers "nobody
    # was asked" when it is absent, and the detector works as it did before.
    "spylls>=0.1.7,<0.2",
    # 0.5 (D-052). A PDF with a text layer, read into the same model as an
    # EPUB: characters with their position, font and size, images and the
    # outline. Pure Python and MIT, so it builds on the Windows runner;
    # poppler is not on a user's machine and PyMuPDF is AGPL with binaries.
    "pdfminer.six>=20250327,<20270000",
    # Pillar E: the font subset stage imports it at run time. Declared here
    # since the independent audit of 2026-09-04 (EF-073) found it missing —
    # on an installation made from the lock the stage did nothing and the
    # report blamed the book's fonts for the absence of a library.
    "fonttools>=4.50,<5",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6,<7"]
dev = ["pytest>=8.0,<10", "pytest-cov>=6,<8"]
# Q01 of the quality roadmap: a diagram made of vector strokes is not a picture
# to carry, so a page whose content was a drawing arrived as callout labels
# with nothing to label. This draws the region instead.
#
# PDFium and not the alternatives, and the reason is licence and distribution
# rather than price — the check the roadmap actually asks for. `pypdfium2` is
# BSD-3 and Apache-2.0 with permissive dependencies, and ships a prebuilt
# binary for Windows in a 3.9 MB wheel; MuPDF is AGPL or commercial, which
# would take the whole application with it. The Chromium this program already
# needs for the appearance gate embeds PDFium and will not render a PDF to a
# screenshot in headless — measured three ways, all a blank viewer background.
#
# **Optional on purpose.** Without it the drawings are not carried and the
# report says exactly that, as it did before; nothing fails and nothing
# pretends the drawing arrived. Making it required would put a binary
# dependency in the path of every EPUB→EPUB rebuild, which has no PDF in it.
draw = ["pypdfium2>=4,<6"]

[project.scripts]
epubforge = "epubforge.cli:main"

[tool.setuptools.dynamic]
version = { attr = "epubforge.__version__" }

[tool.setuptools.packages.find]
include = ["epubforge*"]

# The validator driver is Java source that ships with the package and is
# compiled on first use where there is a JDK — a packaged release compiles it
# at packaging time instead. Without this line setuptools installs only the
# .py files and an installed copy silently starts a JVM per book.
[tool.setuptools.package-data]
epubforge = ["java/*.java"]

[tool.pytest.ini_options]
markers = [
    "renders: needs a browser and draws pages; excluded from the suite-wide skip",
    "validates: asks EPUBCheck for a verdict on purpose; the gate is not stood down",
]
testpaths = ["tests"]
