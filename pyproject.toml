[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-forge"
dynamic = ["version"]
description = "EPUB F.O.R.G.E. — Factory for Overhauling and Renovating Glitchy EPUBs: rebuilds any EPUB into standards-clean EPUB 3.3 while preserving its visual identity"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

dependencies = [
    "lxml>=5.0",
    "cssutils>=2.9",
    "Pillow>=10.0",
    "rich>=13.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8.0"]

[project.scripts]
epubforge = "epubforge.cli:main"

[tool.setuptools.dynamic]
version = { attr = "epubforge.__version__" }

[tool.setuptools.packages.find]
include = ["epubforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
