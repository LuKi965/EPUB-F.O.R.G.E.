name: Build Windows

# The repository is named "EPUB-F.O.R.G.E." — with a trailing dot — and Windows
# cannot hold a directory whose name ends in one. That makes the runner's own
# workspace, D:\a\<repo>\<repo>, a path that cannot exist, and everything
# downstream of it fails before it does any work:
#
#   ##[error]Directory 'D:\a\EPUB-F.O.R.G.E.\EPUB-F.O.R.G.E.' does not exist
#
# actions/checkout raises that while validating GITHUB_WORKSPACE, which happens
# before it looks at its own inputs — so its `path:` option cannot rescue it.
# Every `run:` step would fail the same way, since that same directory is their
# default working directory.
#
# So this job never touches the workspace. It clones into a fixed, dot-free
# path and works from there. Renaming the repository to a name without a
# trailing dot is the real fix, and would let all of this collapse back to a
# plain `actions/checkout@v4`; the display name can keep its dots either way.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Publish a release under this tag (e.g. v0.2.0), creating the tag at
          the commit being built. Leave empty to build without releasing.
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

defaults:
  run:
    # Literal, not an expression: the `env` context is not available here.
    working-directory: D:\forge

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Stands in for actions/checkout. Runs from D:\, which does exist,
      # because D:\forge is what this step is about to create.
      - name: Check out into a path Windows can represent
        working-directory: D:\
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $ref = "${{ github.ref_name }}"
          if (Test-Path D:\forge) { Remove-Item D:\forge -Recurse -Force }
          git clone --depth 1 --branch $ref `
            "https://x-access-token:$env:GH_TOKEN@github.com/$repo.git" D:\forge
          # Drop the token from the clone's config; nothing later needs to push.
          git -C D:\forge remote set-url origin "https://github.com/$repo.git"
          git -C D:\forge log --oneline -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Provides jlink, which builds the minimal runtime that gets bundled.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # If a lock is present it is used, and used strictly: --require-hashes
      # makes pip refuse any artifact whose bytes are not the bytes that were
      # resolved. Without one, the ranges in pyproject.toml apply and the build
      # says so out loud rather than looking pinned.
      - name: Install dependencies
        shell: pwsh
        run: |
          # Every pip call goes through here, because PowerShell does not stop
          # for a native command that failed. 0.2.22 built with no PyInstaller
          # installed at all: `pip install --require-hashes -r pyinstaller.lock`
          # exited 1 on a missing pin, the step went green, and the failure
          # surfaced four steps later as something else entirely. An install
          # step that can report success while installing nothing is worse than
          # no install step, because the log says it worked.
          function pip-or-stop {
            pip @args
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::pip $($args -join ' ') exited $LASTEXITCODE"
              exit $LASTEXITCODE
            }
          }
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path requirements.lock) {
            Write-Host "installing from requirements.lock with hash checking"
            pip-or-stop install --require-hashes -r requirements.lock
            if (Test-Path pyinstaller.lock) {
              pip-or-stop install --require-hashes -r pyinstaller.lock
            }
            pip-or-stop install -e . --no-deps
          } else {
            Write-Host "no requirements.lock -- resolving from the ranges in pyproject.toml"
            pip-or-stop install -e ".[gui,dev]"
            pip-or-stop install pyinstaller
          }
          # And the thing the manifest could not tell anyone: is the packager
          # actually here. Asked now, next to the install, rather than by the
          # build step failing with an unrelated-looking message.
          python -c "import PyInstaller; print('pyinstaller', PyInstaller.__version__)"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::PyInstaller is not installed -- the lock did not deliver it"
            exit 1
          }

      # Which versions actually built this. The dependency declarations carry
      # bounds rather than a lock, so the only honest record of what produced a
      # given binary is taken at the moment it is produced — and an incident
      # nobody can reproduce is an incident nobody can fix.
      # Staged before the tests rather than only as part of the bundle, and it
      # changes what the test run means. Until 0.2.23 the validator arrived
      # four steps later, so on the one platform this project releases for, 17
      # tests skipped themselves with "EPUBCheck is not installed here" — the
      # EPUBCheck-dependent half of the suite never ran on Windows at all.
      #
      # It is also load-bearing now. Strict mode asks the validator before
      # publishing and refuses when it cannot, on the argument that a gate
      # passing what it could not check is not a gate. A runner with no
      # validator is a runner where strict refuses every book, which is the
      # program being right and the CI being wrong.
      - name: Stage EPUBCheck for the test run
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0,'packaging'); import build; build.stage_epubcheck(None)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $jar = Join-Path (Get-Location) "packaging\_bundle\epubcheck\epubcheck.jar"
          if (-not (Test-Path $jar)) {
            Write-Host "::error::epubcheck.jar was not staged at $jar"
            exit 1
          }
          "EPUBCHECK_JAR=$jar" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "EPUBCHECK_JAR=$jar"

      - name: Run tests
        run: pytest -q

      # K2 says the output is a function of the input. Iterating a set is the
      # classic way for that to stop being true, and a single-process test run
      # can never notice: one seed per process means the order is stable within
      # the run and different between runs. A second pass under a different seed
      # is the cheapest thing that would catch it.
      - name: Run tests again under a different hash seed
        shell: pwsh
        env:
          PYTHONHASHSEED: "12345"
        run: pytest -q

      - name: Build the bundled distribution
        run: python packaging/build.py --clean

      # Runs the packaged .exe with the environment stripped, so a pass proves
      # the bundled JRE and EPUBCheck did the work rather than the runner's.
      - name: Verify the frozen build is self-contained
        run: python packaging/smoke_test.py

      # **After** the build, not before, and that is a correction. `build.py`
      # wipes `dist/` before it runs, so a manifest written earlier was
      # deleted every single time — every release since this step existed
      # attached an installer and quietly no manifest, and the upload step
      # said so in one line nobody read: `Pattern ... does not match any
      # files`. The only honest record of what produced a binary is taken
      # where the binary still exists.
      - name: Record the build manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          "EPUB F.O.R.G.E. build manifest" | Out-File -Encoding utf8 dist/build-manifest.txt
          "date: $(Get-Date -Format o)" | Out-File -Append -Encoding utf8 dist/build-manifest.txt
          "commit: $env:GITHUB_SHA" | Out-File -Append -Encoding utf8 dist/build-manifest.txt
          "python: $(python -V)" | Out-File -Append -Encoding utf8 dist/build-manifest.txt
          "epubcheck: $(python -c "import sys; sys.path.insert(0,'packaging'); import build; print(build.EPUBCHECK_VERSION)")" | Out-File -Append -Encoding utf8 dist/build-manifest.txt
          "chromium: $(python -c "import sys; sys.path.insert(0,'packaging'); import build; print(build.CHROMIUM_VERSION)")" | Out-File -Append -Encoding utf8 dist/build-manifest.txt
          "" | Out-File -Append -Encoding utf8 dist/build-manifest.txt
          pip freeze | Out-File -Append -Encoding utf8 dist/build-manifest.txt
          Get-Content dist/build-manifest.txt

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = (python -c "import epubforge; print(epubforge.__version__)")
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF -replace "refs/tags/v", ""
          }
          $asked = "${{ inputs.release_tag }}"
          if ($asked) {
            $version = $asked -replace "^v", ""
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          # Whether a release is a pre-release is not a separate decision to be
          # made at release time and got wrong; it is what `__stage__` already
          # says. Empty means the maturity claim has been made in the source.
          $stage = (python -c "import epubforge; print(epubforge.__stage__)").Trim()
          $prerelease = if ($stage) { "true" } else { "false" }
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" packaging\installer.iss

      - name: Package the portable build
        shell: pwsh
        run: |
          Compress-Archive -Path dist\EPUB-Forge\* `
            -DestinationPath "dist\EPUB-Forge-${{ steps.version.outputs.version }}-portable.zip"

      # Absolute paths: artifact globs resolve against the workspace, which is
      # the directory this whole job exists to avoid.
      - uses: actions/upload-artifact@v4
        with:
          name: EPUB-Forge-windows
          path: |
            D:\forge\dist\installer\*.exe
            D:\forge\dist\*-portable.zip
            D:\forge\dist\build-manifest.txt
          retention-days: 30

      # Two ways in. A tag push is the ordinary one. The `release_tag` input
      # exists because pushing a tag needs a terminal, and the person who
      # decides what gets released does not use one — with the input, the tag
      # is created here, at the commit that was just built and tested, which is
      # a stronger guarantee than a tag pushed by hand at whatever was local.
      - name: Collect the release notes
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        run: |
          # --output rather than a pipe: the runner's console is cp1252 and
          # the changelog is not.
          python packaging\release_notes.py "${{ steps.version.outputs.version }}" `
            --output D:\forge\release-notes.md
          Get-Content D:\forge\release-notes.md -TotalCount 3 -Encoding utf8

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: EPUB F.O.R.G.E. ${{ steps.version.outputs.version }}
          body_path: D:\forge\release-notes.md
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            D:\forge\dist\installer\*.exe
            D:\forge\dist\*-portable.zip
            D:\forge\dist\build-manifest.txt
